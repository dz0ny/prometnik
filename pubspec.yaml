name: promet
description: "Promet, kamere, vreme, potovalni časi in opozorila na slovenskih cestah."
publish_to: 'none'

# Version format: YYYY.MMDD.DAILY+BUILD (see Makefile)
version: 2026.1128.7+25

environment:
  sdk: ^3.14.0
  flutter: ">=3.50.0"

dependencies:
  flutter:
    sdk: flutter

  # Map
  flutter_map: any
  latlong2: any

  # Networking
  http: any

  # Image caching (webcam thumbnails)
  cached_network_image: any
  # Webcam frame store (latest + 24h hourly history); also used by
  # cached_network_image.
  flutter_cache_manager: any

  # Routing
  go_router: any

  # State management + DI
  flutter_riverpod: ^3.5.0

  # Utilities
  intl: any
  shared_preferences: any
  url_launcher: any
  package_info_plus: any

  # Platform-adaptive UI (Material on Android, Cupertino/iOS 26 on iOS)
  adaptive_platform_ui: ^1.0.2
  cupertino_icons: ^2.0.0
  geolocator: ^14.0.1
  flutter_local_notifications: ^23.0.4
  ota_update: ^7.1.0
  workmanager: ^0.10.10

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: any
  flutter_launcher_icons: any

flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  remove_alpha_ios: true
  image_path: "icon.png"
  min_sdk_android: 21
  web:
    generate: true
    image_path: "icon.png"
    background_color: "#0D1B2A"
    theme_color: "#1B263B"
  macos:
    generate: true
    image_path: "icon.png"

flutter:
  uses-material-design: true

  # Slovenian road geometry (OSM via HOTOSM, ODbL) — used to highlight roads
  # within a traffic event's affected-area bbox.
  assets:
    - assets/roads.json

  # Rounded display face for numbers (temperatures, times, counts), used via
  # AppTheme.numberStyle. Nunito, SIL OFL 1.1 — see assets/fonts/OFL-Nunito.txt.
  # Variable font (wght 200–1000); AppTheme sets the axis explicitly.
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Variable.ttf
