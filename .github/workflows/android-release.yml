name: Android Release

on:
  release:
    types:
      - published

permissions:
  contents: write

jobs:
  build-android:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle
          cache-dependency-path: |
            android/*.gradle*
            android/**/*.gradle*
            android/**/gradle-wrapper.properties

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      # Optional: if release-signing secrets are set, sign with the real
      # keystore; otherwise the build falls back to debug signing (still
      # installable for sideloading).
      - name: Configure Android signing (optional)
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-keystore.jks
            {
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyPassword=$ANDROID_KEY_PASSWORD"
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "storeFile=../release-keystore.jks"
            } > android/key.properties
            echo "Release signing configured."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret — building debug-signed release APK."
          fi

      - name: Build release APKs
        run: |
          flutter build apk --release --split-per-abi
          flutter build apk --release

      - name: Rename APKs with release tag
        env:
          RELEASE_TAG: ${{ github.event.release.tag_name }}
        run: |
          cd build/app/outputs/flutter-apk
          mv app-arm64-v8a-release.apk   "prometnik-${RELEASE_TAG}-arm64-v8a.apk"   2>/dev/null || true
          mv app-armeabi-v7a-release.apk "prometnik-${RELEASE_TAG}-armeabi-v7a.apk" 2>/dev/null || true
          mv app-x86_64-release.apk      "prometnik-${RELEASE_TAG}-x86_64.apk"      2>/dev/null || true
          mv app-release.apk             "prometnik-${RELEASE_TAG}-universal.apk"   2>/dev/null || true
          ls -lh prometnik-*.apk

      - name: Upload APKs to GitHub release
        uses: softprops/action-gh-release@v2
        with:
          files: build/app/outputs/flutter-apk/prometnik-*.apk
