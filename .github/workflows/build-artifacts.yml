name: Build And Upload Release Assets

on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: write

env:
  APP_NAME: prometnik

jobs:
  build-android:
    name: Build Android App
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Gradle cache
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
          pub-cache: true
          cache-key: flutter-${{ runner.os }}-stable-${{ runner.arch }}
          pub-cache-key: flutter-pub-${{ runner.os }}-stable-${{ runner.arch }}-${{ hashFiles('pubspec.lock') }}

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Configure Android signing
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -n "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/release-keystore.jks
            {
              echo "storePassword=$ANDROID_KEYSTORE_PASSWORD"
              echo "keyPassword=$ANDROID_KEY_PASSWORD"
              echo "keyAlias=$ANDROID_KEY_ALIAS"
              echo "storeFile=../release-keystore.jks"
            } > android/key.properties
            echo "Release signing configured."
          else
            echo "No ANDROID_KEYSTORE_BASE64 secret. Building debug-signed release artifacts."
          fi

      - name: Build APK
        run: flutter build apk --release --flavor direct

      - name: Build Play AAB
        run: flutter build appbundle --release --flavor play --dart-define=PROMET_PLAY_DISTRIBUTION=true

      - name: Prepare Android artifacts
        run: |
          # No version in the names: the website links to
          # releases/latest/download/prometnik-android.apk, which only works
          # with a stable file name. The release tag carries the version.
          cp build/app/outputs/flutter-apk/app-direct-release.apk "${APP_NAME}-android.apk"
          cp build/app/outputs/bundle/playRelease/app-play-release.aab "${APP_NAME}-play.aab"
          ls -lah "${APP_NAME}-android.apk" "${APP_NAME}-play.aab"

      - name: Upload Android artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-android
          path: |
            ${{ env.APP_NAME }}-android.apk
            ${{ env.APP_NAME }}-play.aab
          if-no-files-found: error

  upload-release-assets:
    name: Upload Assets To Release
    if: github.event_name == 'release'
    runs-on: ubuntu-latest
    needs:
      - build-android

    steps:
      - name: Download all build artifacts
        uses: actions/download-artifact@v8
        with:
          pattern: release-*
          path: dist
          merge-multiple: true

      - name: Upload assets to published release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ github.event.release.tag_name || github.ref_name }}
          body: |
            Release assets are published for supported build targets:
            - Android installable APK (`.apk`)
            - Google Play App Bundle (`.aab`)
          files: |
            dist/*.apk
            dist/*.aab
          fail_on_unmatched_files: true
